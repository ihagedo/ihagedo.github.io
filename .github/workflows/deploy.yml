name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # sent by ihagedo/hkn-theta-website on a push to its main
  repository_dispatch:
    types: [hkn-website]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # vendor/uarch-map is a submodule of ihagedo/uarch-map (main); its map page is built below
          submodules: true
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: pnpm install
      - name: Build with Astro
        run: pnpm astro build
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the Firestorm map into /uarch-map/
        run: |
          pip install pyyaml
          python vendor/uarch-map/site/build.py firestorm
          mkdir -p dist/uarch-map
          cp vendor/uarch-map/build/site/index.html dist/uarch-map/index.html
      # unlisted HKN sites, each from the main of its private repo (needs the HKN_REPO_TOKEN secret);
      # a failure here skips that site and the rest still deploys
      - name: Check out the HKN Theta site
        id: hkn_theta
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ihagedo/hkn-theta-website
          ref: main
          path: vendor/hkn-theta-website
          token: ${{ secrets.HKN_REPO_TOKEN || github.token }}
      - name: Check out the HKN Beta dev copy
        id: hkn_beta
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ihagedo/hkn-beta-website
          ref: main
          path: vendor/hkn-beta-website
          token: ${{ secrets.HKN_REPO_TOKEN || github.token }}
      - name: Setup Node for the HKN sites
        if: steps.hkn_theta.outcome == 'success' || steps.hkn_beta.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build the HKN Theta site into /hkn-theta-f5f79b/
        if: steps.hkn_theta.outcome == 'success'
        continue-on-error: true
        working-directory: vendor/hkn-theta-website
        env:
          NUXT_APP_BASE_URL: /hkn-theta-f5f79b/
          HKN_UNLISTED: "1"
          NUXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run generate
          cp -r .output/public ../../dist/hkn-theta-f5f79b
      - name: Build the HKN Beta dev copy into /hkn-beta-40901e/
        if: steps.hkn_beta.outcome == 'success'
        continue-on-error: true
        working-directory: vendor/hkn-beta-website
        env:
          NUXT_APP_BASE_URL: /hkn-beta-40901e/
          NUXT_TELEMETRY_DISABLED: "1"
        run: |
          npm install --no-audit --no-fund
          npm run generate
          cp -r .output/public ../../dist/hkn-beta-40901e
          python ../../scripts/rebase_static.py public ../../dist/hkn-beta-40901e /hkn-beta-40901e/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
